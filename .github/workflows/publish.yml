# Publishes to npm when a v* tag is pushed (by release.mjs, which has
# already run the gate once; this run is the independent second opinion).
# Uses npm trusted publishing: no tokens, provenance attached. One-time
# setup on npmjs.com: package settings → Trusted Publisher → GitHub Actions,
# repository gregkozakiewicz/checkmcp, workflow publish.yml.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10; trusted publishing (OIDC) needs npm >= 11.5.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
